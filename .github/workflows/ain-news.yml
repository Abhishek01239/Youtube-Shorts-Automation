name: AINEWS Scheduled Shorts
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to run (AINEWS)'
        required: true
        default: 'AINEWS'
jobs:
  run-ain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Run AINEWS pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_TOKEN_JSON_AINEWS: ${{ secrets.YOUTUBE_TOKEN_JSON_AINEWS }}
        run: python -m pipeline --channel AINEWS
