name: Clip Radar (trending GTA 6 clips)

# Reads public clip info from the Twitch API and reports the top clips + who is live.
# Never downloads or uploads video.
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clip-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests python-dotenv

      - name: Run Clip Radar
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          NOTIFICATION_PROVIDER: ${{ secrets.NOTIFICATION_PROVIDER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python clip_radar.py

      - name: Save Report (best-effort, retry on conflict)
        if: success()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          for i in 1 2 3 4 5; do
            git add data/clip_radar
            if git diff --cached --quiet; then echo "No report changes"; break; fi
            git commit -m "auto: update clip radar [skip ci]" || break
            git fetch origin main
            git rebase -X ours origin/main || git rebase --abort || true
            if git push origin HEAD:main; then echo "Pushed clip radar report"; break; fi
            echo "Push conflict, retrying ($i)..."
            sleep 5
          done
