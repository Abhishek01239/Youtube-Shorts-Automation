name: Scheduled Twitch to YouTube Shorts Automation

on:
  schedule:
    # Trigger ONCE daily at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    # Run all 4 channels in parallel; each gets its own 6h job limit so none is starved.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        channel:
          - ExampleGamingChannel
          - ExistingChannel
          - GAMES
          - MinecraftShorts
    name: ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Shorts + Video Generation for ${{ matrix.channel }}
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          # Channel dynamic tokens passed as environment variables:
          YOUTUBE_TOKEN_JSON_EXISTINGCHANNEL: ${{ secrets.YOUTUBE_TOKEN_JSON_EXISTINGCHANNEL }}
          YOUTUBE_TOKEN_JSON_EXAMPLEGAMINGCHANNEL: ${{ secrets.YOUTUBE_TOKEN_JSON_EXAMPLEGAMINGCHANNEL }}
          YOUTUBE_TOKEN_JSON_GAMES: ${{ secrets.YOUTUBE_TOKEN_JSON_GAMES }}
          YOUTUBE_TOKEN_JSON_MINECRAFTSHORTS: ${{ secrets.YOUTUBE_TOKEN_JSON_MINECRAFTSHORTS }}
          # Notification Configuration Secrets
          NOTIFICATION_PROVIDER: ${{ secrets.NOTIFICATION_PROVIDER }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          USER_PHONE_NUMBER: ${{ secrets.USER_PHONE_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline.py --channels channels.json --channel "${{ matrix.channel }}"

      - name: Commit & Push Updated History (best-effort, retry on conflict)
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          for i in 1 2 3 4 5; do
            find data/channels -type f \( -name "seen_videos.txt" -o -name "upload_log.json" \) -exec git add {} +
            if git diff --cached --quiet; then
              echo "No history changes for ${{ matrix.channel }}"
              break
            fi
            git commit -m "auto: update ${{ matrix.channel }} history [skip ci]" || break
            git fetch origin main
            git rebase -X ours origin/main || git rebase --abort || true
            if git push origin main; then
              echo "Pushed ${{ matrix.channel }} history"
              break
            fi
            echo "Push conflict, retrying ($i)..."
            sleep 5
          done
