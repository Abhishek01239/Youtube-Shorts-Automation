name: Scheduled Twitch to YouTube Shorts Automation

on:
  schedule:
    # Trigger ONCE daily at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Batch Shorts Generation (6 Shorts Created & Scheduled 2h Apart)
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          # Channel dynamic tokens passed as environment variables:
          YOUTUBE_TOKEN_JSON_EXISTINGCHANNEL: ${{ secrets.YOUTUBE_TOKEN_JSON_EXISTINGCHANNEL }}
          YOUTUBE_TOKEN_JSON_EXAMPLEGAMINGCHANNEL: ${{ secrets.YOUTUBE_TOKEN_JSON_EXAMPLEGAMINGCHANNEL }}
        run: |
          python pipeline.py --channels channels.json

      - name: Commit & Push Updated History
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          find data/channels -type f \( -name "seen_videos.txt" -o -name "upload_log.json" \) -exec git add {} +
          git commit -m "auto: update channel history files [skip ci]" || echo "No changes to commit"
          git fetch origin main
          git rebase -X ours origin/main || git rebase --abort || true
          git push origin main || true
